<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Копилка огоньков — ТАМОКО</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff6ec;--card:#ffffff;--ink:#2b1a10;--mute:#8b6e5a;--accent:#e8590c;--accent2:#ffb703;--line:#f1dcc8;--chip:#fff0e0;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#190f0a;--card:#261811;--ink:#fbeadb;--mute:#b89580;--accent:#ff7a2f;--accent2:#ffc23d;--line:#3d281b;--chip:#33201a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#190f0a;--card:#261811;--ink:#fbeadb;--mute:#b89580;--accent:#ff7a2f;--accent2:#ffc23d;--line:#3d281b;--chip:#33201a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:0 0 2px}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:26px 0 10px}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.btn{border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-bottom:8px}
.pick{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:14px;margin-bottom:8px;font:inherit;font-size:17px;cursor:pointer}
.big{text-align:center;padding:28px 14px}
.flame{font-size:72px;line-height:1;animation:fl 1.6s ease-in-out infinite;display:inline-block}
@keyframes fl{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.08) rotate(3deg)}}
.num{font-size:64px;font-weight:800;color:var(--accent);line-height:1.1}
.save{border:1px dashed var(--accent);background:var(--chip);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.plus{color:var(--accent);font-weight:700}.minus{color:var(--mute);font-weight:700}
.note{font-size:13px;color:var(--mute)}
</style>
<style>artifact-sync,artifact-local{display:contents}</style></head>
<body>
<div id="app"></div>
<script id="state" type="application/json">{"students":[{"id":"s1","name":"Даня","log":[{"d":"2026-11-17","n":2,"c":""}]},{"id":"s2","name":"Ника","log":[{"d":"2026-11-17","n":2,"c":""}]},{"id":"s3","name":"Кристина","log":[{"d":"2026-11-17","n":2,"c":""}]},{"id":"s4","name":"Лиза","log":[{"d":"2026-11-17","n":2,"c":""}]},{"id":"s5","name":"Тема","log":[{"d":"2026-11-17","n":2,"c":""}]},{"id":"s6","name":"Ума","log":[]}],"next":7}</script>
<script>
const S = JSON.parse(document.getElementById('state').textContent);
let owner = false, art = null, dirty = false, sel = new Set(), linkFor = null, note = '';
let amount = '1', comment = '', date = today(), newName = '';
const app = document.getElementById('app');

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function bal(s){return s.log.reduce((a,l)=>a+l.n,0)}
function word(n){const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return 'огоньков';if(b===1)return 'огонёк';if(b>1&&b<5)return 'огонька';return 'огоньков'}
function fmtDate(d){const p=d.split('-');return p.length===3?p[2]+'.'+p[1]:d}
function route(){return location.hash.slice(1)}

function render(){
  const st = S.students.find(s=>s.id===route());
  if(st) return renderStudent(st);
  if(owner) return renderAdmin();
  renderPicker();
}

function head(){return '<h1>🔥 Копилка огоньков</h1><p class="sub">Фаер-шоу «ТАМОКО»</p>'}

function renderPicker(){
  let h = head();
  if(!S.students.length){
    h += '<div class="card">Список учеников пока пуст. Загляните после ближайшей тренировки.</div>';
  } else {
    h += '<h2>Выбери своё имя</h2>';
    h += S.students.map(s=>'<button class="pick" data-act="open" data-id="'+s.id+'"><span>'+esc(s.name)+'</span><span>›</span></button>').join('');
  }
  app.innerHTML = h;
}

function renderStudent(s){
  const n = bal(s);
  const log = s.log.slice().reverse().slice(0,30);
  let h = '<button class="btn ghost sm" data-act="back">← Назад</button><div style="height:12px"></div>';
  h += '<div class="card big"><div class="flame">🔥</div><div class="note" style="margin-top:6px">'+esc(s.name)+'</div><div class="num">'+n+'</div><div>'+word(n)+' в твоей копилке</div></div>';
  h += '<h2>История</h2>';
  if(!log.length) h += '<div class="card note">Пока пусто. Огоньки появятся после первой тренировки.</div>';
  h += log.map(l=>'<div class="card row"><div><div>'+esc(l.c||'Тренировка')+'</div><div class="note">'+fmtDate(l.d)+'</div></div><div class="'+(l.n>=0?'plus':'minus')+'">'+(l.n>0?'+':'')+l.n+' 🔥</div></div>').join('');
  app.innerHTML = h;
}

function renderAdmin(){
  let h = head();
  if(dirty) h += '<div class="save"><div class="row"><span>Есть несохранённые изменения</span><button class="btn sm" data-act="save">Сохранить</button></div><div class="note">Пока не нажмёте, ученики старых данных не обновят.</div></div>';
  if(note) h += '<div class="card note">'+esc(note)+'</div>';

  h += '<h2>Начислить за тренировку</h2><div class="card">';
  if(!S.students.length) h += '<div class="note">Сначала добавьте учеников ниже.</div>';
  else {
    h += '<div class="note">Кто был на тренировке:</div><div class="chips">';
    h += S.students.map(s=>'<button class="chip'+(sel.has(s.id)?' on':'')+'" data-act="tog" data-id="'+s.id+'">'+esc(s.name)+'</button>').join('');
    h += '<button class="chip" data-act="all">Все</button></div>';
    h += '<div class="grid2"><input id="amt" type="number" inputmode="numeric" value="'+esc(amount)+'" aria-label="Сколько огоньков"><input id="cmt" type="text" placeholder="За что (необязательно)" value="'+esc(comment)+'"></div>';
    h += '<input id="dt" type="date" value="'+esc(date)+'" style="margin-bottom:10px">';
    h += '<button class="btn" style="width:100%" data-act="give">Начислить 🔥</button><div class="note" style="margin-top:6px">Чтобы списать огоньки, введите минус, например −5.</div>';
  }
  h += '</div>';

  h += '<h2>Ученики</h2>';
  h += S.students.map(s=>{
    let r = '<div class="card"><div class="row"><div><b>'+esc(s.name)+'</b></div><div class="plus">'+bal(s)+' 🔥</div></div>';
    r += '<div class="row" style="margin-top:8px;justify-content:flex-start;flex-wrap:wrap"><button class="btn ghost sm" data-act="open" data-id="'+s.id+'">Открыть</button><button class="btn ghost sm" data-act="link" data-id="'+s.id+'">Ссылка</button><button class="btn ghost sm" data-act="del" data-id="'+s.id+'">Удалить</button></div>';
    if(linkFor===s.id) r += '<input readonly value="'+esc(location.href.split('#')[0]+'#'+s.id)+'" style="margin-top:8px" onfocus="this.select()"><div class="note">Личная ссылка ученика. Нажмите на поле и скопируйте.</div>';
    return r+'</div>';
  }).join('');
  h += '<div class="card"><div class="grid2" style="grid-template-columns:1fr auto"><input id="nn" type="text" placeholder="Имя ученика" value="'+esc(newName)+'"><button class="btn" data-act="add">Добавить</button></div></div>';
  h += '<p class="note">Видно всем, у кого есть ссылка, поэтому пишите только имена или ники.</p>';
  app.innerHTML = h;
}

app.addEventListener('input', e=>{
  if(e.target.id==='amt') amount=e.target.value;
  if(e.target.id==='cmt') comment=e.target.value;
  if(e.target.id==='dt') date=e.target.value;
  if(e.target.id==='nn') newName=e.target.value;
});

app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id;
  note='';
  if(act==='open'){ location.hash=id; return; }
  if(act==='back'){ location.hash=''; if(!route()) render(); return; }
  if(!owner) return;
  if(act==='tog'){ sel.has(id)?sel.delete(id):sel.add(id); }
  else if(act==='all'){ sel = sel.size===S.students.length ? new Set() : new Set(S.students.map(s=>s.id)); }
  else if(act==='give'){
    const n = parseInt(amount,10);
    if(!sel.size){ note='Отметьте, кто был на тренировке.'; }
    else if(!n){ note='Введите число огоньков.'; }
    else {
      S.students.forEach(s=>{ if(sel.has(s.id)) s.log.push({d:date||today(),n:n,c:comment.trim()}); });
      note='Начислено: '+(n>0?'+':'')+n+' 🔥 · '+sel.size+' чел. Не забудьте сохранить.';
      sel=new Set(); comment=''; dirty=true;
    }
  }
  else if(act==='add'){
    const nm=newName.trim();
    if(nm){ S.students.push({id:'s'+S.next,name:nm,log:[]}); S.next++; newName=''; dirty=true; }
  }
  else if(act==='del'){
    const s=S.students.find(x=>x.id===id);
    if(s && confirm('Удалить «'+s.name+'» вместе с историей огоньков?')){ S.students=S.students.filter(x=>x.id!==id); sel.delete(id); dirty=true; }
  }
  else if(act==='link'){ linkFor = linkFor===id ? null : id; }
  else if(act==='save'){ save(); return; }
  render();
});

async function save(){
  if(!art){ note='Сохранение доступно только владельцу страницы.'; render(); return; }
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#app').innerHTML='';
  clone.querySelector('#state').textContent = JSON.stringify(S).replace(/</g,'\\u003c');
  try{
    await art.publish('<!doctype html>\n'+clone.outerHTML);
  }catch(err){
    note = err && err.code==='conflict' ? 'Страница обновилась в другом окне. Откроется свежая версия, повторите ввод.' : 'Не удалось сохранить. Попробуйте ещё раз.';
    render();
  }
}

window.addEventListener('hashchange', render);
render();

(async()=>{
  try{
    const u = await claude.use('user');
    owner = !!(u && (u.isOwner() || u.canEdit()));
    art = await claude.use('artifact');
    render();
  }catch(e){}
})();
</script>


</body></html>
